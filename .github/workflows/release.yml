name: Release

on:
  push:
    tags:
      # Actions uses glob filters. The gate below enforces strict numeric SemVer.
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Validate release ref
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout exact workflow commit and all version tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check version match and main ancestry (tag pushes only)
        id: metadata
        run: node scripts/release.mjs gate

  verify:
    name: Verify (${{ matrix.os }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Install pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build node-pty from source on Linux
        if: runner.os == 'Linux'
        run: pnpm rebuild node-pty

      - name: Verify (lint, typecheck and tests)
        run: pnpm run verify

      - name: Test release gates and notes
        run: node --test scripts/release.test.mjs

  build:
    name: Build (${{ matrix.platform }})
    # Neither platform packages until verification succeeds on both systems.
    needs: [gates, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: windows-installer
            filename: NeKode-Setup-${{ needs.gates.outputs.version }}.exe
          - os: ubuntu-22.04
            platform: linux
            artifact: linux-appimage
            filename: NeKode-${{ needs.gates.outputs.version }}-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Install pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build node-pty from source on Linux
        if: runner.os == 'Linux'
        run: pnpm rebuild node-pty

      - name: Package without publishing
        run: pnpm run build:${{ matrix.platform }}

      - name: Upload the named binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [gates, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact release commit and history for notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-assets

      - name: Check binaries, generate checksums and notes, then create a new draft
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.gates.outputs.version }}
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const { join } = require('node:path')
            const { createDraftRelease } = await import(
              pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'scripts/release.mjs')).href
            )
            const url = await createDraftRelease({
              github,
              context,
              directory: join(process.env.GITHUB_WORKSPACE, 'release-assets'),
              version: process.env.RELEASE_VERSION,
            })
            core.notice(`Draft release ready for manual inspection: ${url}`)
