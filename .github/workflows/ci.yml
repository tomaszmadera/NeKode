# CI for NeKode: lint + typecheck + tests, the same command as locally.
# See docs/development/ci.md (what runs, when, and on which system).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The check name must stay exactly "verify": branch protection on main
    # requires it. The step below lists what it runs.
    name: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify (biome lint + tsc typecheck + vitest)
        run: pnpm run verify

  verify-linux:
    # Advisory Linux job (Phase 0 of the Linux plan): same verify command on
    # the same Ubuntu version as the release AppImage build (release.yml).
    # Not a required check; the required "verify" job above stays the Windows gate.
    name: verify-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools (node-pty has no Linux prebuild)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Install pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build node-pty from source
        run: pnpm rebuild node-pty

      - name: Verify (biome lint + tsc typecheck + vitest)
        run: pnpm run verify
