# electron-builder configuration (added 2026-09-24, stack-update-hardening).
# Release targets and artifact names are explicit for Windows and Linux.
#
# npmRebuild: false - both native dependencies ship ABI-stable N-API prebuilds
#   (better-sqlite3 13.x: prebuilds/*.node incl. win32-x64; node-pty 1.1.0:
#   prebuilds/win32-x64 staged into build/Release by its install script).
#   Rebuilding them for Electron would require VS C++ Build Tools (not
#   available on this host) and is not needed for N-API modules.
npmRebuild: false
extraResources:
  - from: resources/dictation/desktop-shortcut.ps1
    to: dictation/desktop-shortcut.ps1
  # Shipped usage adapters (usage-quota spec rule 17, added 2026-10-21; the
  # Claude Code snapshot writer was removed 2026-10-23, spec L8; the Claude
  # Code usage adapter was added 2026-10-23, spec L10). Keep the
  # adapter list in sync with BUNDLED_USAGE_ADAPTERS in
  # src/main/services/usage/adapter-host.ts.
  # Bundled `node` adapters run on the NeKode executable with
  # ELECTRON_RUN_AS_NODE, so the RunAsNode Electron fuse must stay enabled.
  - from: adapters/usage-claude
    to: usage-adapters/usage-claude
  - from: adapters/usage-codex
    to: usage-adapters/usage-codex

# Windows application icon (added 2026-10-01, user request): the branded cat
# rasterized from src/renderer/src/assets/brand/cat-icon.svg, a rounded tile
# with transparent corners (2026-10-22: the square cat-icon-tile.svg showed a
# dark square on the desktop). 16-256px; regenerate with ImageMagick
# `-background none -density 384` to 1024px, then `-define icon:auto-resize`) as the
# exe icon; Windows derives the taskbar icon from it in packaged builds, and
# the NSIS installer/uninstaller icons fall back to the application icon. The
# same file is the dev window icon (BrowserWindow icon in src/main/index.ts).
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: NeKode-Setup-${version}.${ext}

# Display names only (added 2026-10-22, user request): without productName the
# Start menu and desktop shortcuts and the Apps entry used the lowercase
# package name "nekode". The exe, install directory and userData keep the
# package name. An update renames old "nekode.lnk" shortcuts.
nsis:
  shortcutName: NeKode
  uninstallDisplayName: NeKode ${version}

# Linux application icon (added 2026-10-20, NEKODE-13 Phase 1): 512x512 PNG
# rasterized from the same cat-icon.svg master as icon.ico (ImageMagick,
# PNG32 with transparent corners, since 2026-10-22).
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: NeKode-${version}-x86_64.${ext}
