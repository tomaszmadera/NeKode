schema_version: 2
harness:
  version: "7.2.4"
  excluded_skills: []
project:
  name: "NeKode"
  kind: application
  status: active
  layout: "single-package pnpm workspace (src/main, src/preload, src/renderer)"
tooling:
  python_minimum: "3.11"
runtime:
  language: TypeScript
  language_version: "5.9.3"
  framework: Electron
  framework_version: "44.4.5"
database:
  engine: SQLite
  version: "3.53.4"
local_environment:
  provider: "windows-native (Windows 11, Node 24.18.0, pnpm 12.5.1)"
quality:
  test_runner: vitest
  formatter: biome
  static_analysis: biome
  architecture_tests: none
verification:
  changed_command: "cmd /c pnpm run lint && cmd /c pnpm run typecheck"
  full_command: "cmd /c pnpm run verify"
publication:
  strategy: linear
  versioning: semver
commands:
  preflight: "{python} .agents/scripts/preflight"
  validate_agent_config: "{python} .agents/scripts/validate-config"
  task_status: "{python} .agents/scripts/task-status"
  handoff_status: "{python} .agents/scripts/handoff-status"
  ci: "{python} .agents/skills/ci/scripts/ci.py"
  bump: "{python} .agents/skills/ci/scripts/ci.py bump"
  release: "{python} .agents/skills/ci/scripts/ci.py release"
  harness_config_update: "{python} .agents/skills/harness-config-update/scripts/harness_config_update.py"
  verify_targeted: "{python} .agents/scripts/verify-targeted --"
  verify_changed: "{python} .agents/scripts/verify-changed"
  verify_full: "{python} .agents/scripts/verify-full"
